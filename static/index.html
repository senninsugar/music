<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#111; color:#eee; }
  header { position:sticky; top:0; background:#111; padding:12px; border-bottom:1px solid #333; z-index:1; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:10px; border-radius:8px; border:1px solid #444; background:#222; color:#eee; font-size:16px; }
  button { padding:10px 14px; border-radius:8px; border:0; background:#e33; color:#fff; cursor:pointer; }
  #status { padding:12px; color:#999; }
  ul { list-style:none; margin:0; padding:0 0 130px; }
  li { display:flex; gap:12px; padding:10px 12px; cursor:pointer; align-items:center; }
  li:hover, li.active { background:#222; }
  li img { width:120px; height:68px; object-fit:cover; border-radius:6px; flex:none; background:#333; }
  .meta { min-width:0; }
  .title { font-size:15px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .sub { font-size:12px; color:#999; margin-top:4px; }
  #player { position:fixed; bottom:0; left:0; right:0; background:#1b1b1b; padding:10px 12px; border-top:1px solid #333; }
  #now { font-size:14px; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  audio { width:100%; }
</style>
</head>
<body>
<header>
  <form id="f">
    <input id="q" placeholder="曲名・アーティスト名で検索" autocomplete="off">
    <button type="submit">検索</button>
  </form>
</header>
<div id="status"></div>
<ul id="list"></ul>
<div id="player">
  <div id="now">再生していません</div>
  <audio id="audio" controls preload="none"></audio>
</div>

<script>
const $ = s => document.querySelector(s);
const audio = $("#audio");
let results = [];
let current = -1;
let retries = 0;

function fmt(sec) {
  if (sec == null) return "";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (!q) return;
  $("#status").textContent = "検索中…";
  $("#list").innerHTML = "";
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q) + "&n=25");
    if (!r.ok) throw new Error(await r.text());
    results = await r.json();
    $("#status").textContent = results.length ? "" : "見つかりませんでした";
    render();
  } catch (err) {
    $("#status").textContent = "検索に失敗: " + err.message;
  }
});

function render() {
  const ul = $("#list");
  ul.innerHTML = "";
  results.forEach((t, i) => {
    const li = document.createElement("li");
    if (i === current) li.className = "active";

    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = t.thumbnail;

    const meta = document.createElement("div");
    meta.className = "meta";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = t.title;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = `${t.channel ?? ""} ・ ${fmt(t.duration)}`;
    meta.append(title, sub);

    li.append(img, meta);
    li.onclick = () => play(i);
    ul.appendChild(li);
  });
}

function load(i) {
  const t = results[i];
  $("#now").textContent = t.title;
  audio.src = `/stream/${t.id}`;
  audio.play().catch(() => {});
}

function play(i) {
  current = i;
  retries = 0;
  load(i);

  if ("mediaSession" in navigator) {
    const t = results[i];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title,
      artist: t.channel ?? "",
      artwork: [{ src: t.thumbnail }],
    });
    navigator.mediaSession.setActionHandler("nexttrack", () => {
      if (current < results.length - 1) play(current + 1);
    });
    navigator.mediaSession.setActionHandler("previoustrack", () => {
      if (current > 0) play(current - 1);
    });
  }
  render();
}

audio.addEventListener("ended", () => {
  if (current < results.length - 1) play(current + 1);
});

audio.addEventListener("error", () => {
  // 署名URLが失効した可能性があるので1回だけ取り直す
  if (current >= 0 && retries < 1) {
    retries++;
    load(current);
  } else {
    $("#now").textContent += "（再生エラー）";
  }
});
</script>
</body>
</html>
